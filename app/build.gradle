plugins {
    id 'com.android.application'
}

android {
    namespace 'com.exynos.neuralprobe'
    compileSdk 35
    ndkVersion '26.3.11579264'

    defaultConfig {
        applicationId 'com.exynos.neuralprobe'
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName '0.1.0'

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17 -O2 -Wall -Wextra'
                abiFilters 'arm64-v8a'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
